        - [W2094432207, "short switching times"]
      note: >-
        Many route papers report sub-microsecond to microsecond times. The low end is a packaged digital
        switch (W2615050161). The high end is an early cantilever waveguide switch whose abstract writes
        microseconds as /spl mu/s (W2094432207).
    insertion_loss:
      value: "under 1.5 to 22.7"
      unit: dB
      value_min: "1.5"
      value_max: "22.7"
      confidence: medium
