# Stage 6 analyst cell decisions, read by pipeline.matrix_build.
# Quote spec: [source, start, end]. source is a paper_id from data/work/route_<route>.json
# or "row:N" for data/projects.csv. The script slices the quote from the source text,
# from `start` through `end` (or to the end of the sentence when `end` is left out).
# Nothing here is a quote. Every number in value/unit/min/max/note must appear in a quote.
# A reported value must share a word or number with its first quote, so category codes carry
# the quote's signal words, e.g. "lab (fabricated)" (stage 6 rework after audit check b).

default_read:   # route -> paper whose full text would most likely fill that route's gaps
  mems_3d: W4292950821
  mems_2d: W2914521323
  mems_silicon_photonic: W2909208749
  lcos: W3034334810
  piezo: W2913395450
  thermo_optic: W2896156020
  electro_optic: W2896156020
  soa: W2056973550
  robotic_patch_panel: W2073240697

cells:
# ---------------------------------------------------------------- mems_3d
- route: mems_3d
  dim: switching_time
  value: "150 us to few ms"
  unit: "us to ms"
  min: "150 us"
  max: "few ms"
  status: reported
  conf: medium
  quotes:
    - ["W2560361359", "We present the design, fabrication", "interconnection mappings."]
    - ["W2996949883", "However, 3D MEMS fabrics are generally dismissed", "($100/port)."]
  note: "150 us is a 61-port selector switch prototype that is only partially configurable (W2560361359). Few ms is how W2996949883 describes conventional 3D MEMS fabrics."
- route: mems_3d
  dim: insertion_loss
  value: "1.33 to 4.0"
  unit: dB
  min: "1.33"
  max: "4.0"
  status: reported
  conf: high
  quotes:
    - ["W2040047675", "This paper describes the subsystem design", "less than 2dB."]
    - ["W2138361600", "We present a microelectromechanical", "across all possible connections."]
  note: "1.33 dB is the average loss of a 256 port fabric (W2040047675). 4.0 dB is the maximum loss of a fabric with more than 1100 ports (W2138361600)."
- route: mems_3d
  dim: port_count
  value: "exceeding 1100 ports"
  unit: ports
  status: reported
  conf: medium
  quotes:
    - ["W2138361600", "We present a microelectromechanical", "across all possible connections."]
    - ["W1982772673", "We review the performance and applications of compact"]
    - ["W2560361359", "We demonstrate the scalability of this switch architecture"]
  note: "W1982772673 reports a 320 x 320 switch. W2560361359 gives an optical design for a 2048-port selector switch, which is a design and is only partially configurable. The stored abstract of W3041044413 gives a port count that disagrees with its title (a digit looks lost), so it is not used."
- route: mems_3d
  dim: polarization_dependent_loss
  status: not_reported_in_abstract
  note: "The stored abstract of W3215039088 has a garbled polarization dependent loss figure (math markup lost in the source record), so it is not used. A human should check the full text of W3215039088 or W4292950821."
- route: mems_3d
  dim: crosstalk
  status: not_reported_in_abstract
  note: "W2040047675 says measured static and dynamic crosstalk were compared but gives no figure in the abstract. A human should check the full text of W2040047675 or W4292950821."
- route: mems_3d
  dim: wavelength_range
  value: "1500 to 1630 nm (S, C and L bands)"
  unit: nm
  min: "1500"
  max: "1630"
  status: reported
  conf: medium
  quotes:
    - ["W3215039088", "over an ultra-wide wavelength range from 1500 nm", "1630 nm"]
    - ["W3215039088", "Bit-error-rate measurements using optical signals"]
  note: "From a core selective switch built on a MEMS mirror array for spatial channel networks, not an N x N crossconnect."
- route: mems_3d
  dim: integration
  value: "free_space_bulk (collimator array and MEMS mirror array)"
  status: reported
  conf: high
  quotes:
    - ["W3215039088", "In this paper, we report on a novel CSS design"]
    - ["W2560361359", "This architecture and switch design enable MEMS beam-steering micromirrors"]
  note: "Collimator arrays and tilting mirror arrays in free space."
- route: mems_3d
  dim: packaging_notes
  value: "cubic switch housing, tolerance-expansion packaging and shock absorption for reliability; loss stable within 0.2 dB over days without feedback control"
  status: reported
  conf: medium
  quotes:
    - ["W2043855221", "stable switch housing with cubic structure", "reliability by shock absorption"]
    - ["W2138361600", "The resulting connections feature optical loss stability"]
- route: mems_3d
  dim: trl_band
  value: production
  status: reported
  conf: high
  quotes:
    - ["W4292950821", "In this paper, we describe Apollo"]
    - ["row:1", "Over multiple years"]
    - ["row:4", "With over 1 million port switches shipped"]
  note: "Apollo is Google's internal deployment (projects.csv row 1). Calient row 4 is a vendor claim."
- route: mems_3d
  dim: ai_cluster_fit
  value: "partial (datacenter applications)"
  status: reported
  conf: medium
  quotes:
    - ["W4292950821", "We then delve into the requirements of OCSes"]
    - ["W2996949883", "With these improvements in hand"]
  note: "Data center networks, including production use in Apollo. No mems_3d abstract mentions accelerator, TPU, GPU, or ML training clusters. The cluster papers are tagged architecture_only (see the note under the table)."
- route: mems_3d
  dim: cost_per_port
  value: "100"
  unit: "USD per port"
  status: reported
  conf: low
  quotes:
    - ["W2996949883", "However, 3D MEMS fabrics are generally dismissed", "($100/port)."]
  note: "Stated as the typical cost that keeps 3D MEMS out of data centers, not a measured price. The same abstract claims its open loop control cuts cost by a factor of three."
- route: mems_3d
  dim: scaling_limit
  value: "switching speed falls as port count grows (mirror optics and kinematics); cross-axis coupling of two-axis mirrors slows switching"
  status: reported
  conf: medium
  quotes:
    - ["W2560361359", "However, conventional MEMS beam-steering cross-connects"]
    - ["W2108251206", "We present a first-principles analysis"]
    - ["W2529948110", "In a 3DMEMS switch"]

