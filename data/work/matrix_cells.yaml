reading_list:   # paper_id, why. title, year, and the cells it would fill are added by pipeline.matrix_render
  - ["W4292950821", "Google's production Apollo system paper. A hyperscaler system paper states the design targets for port count, switching time, and optical performance, so it is the best single read for the 3D MEMS gaps and for AI cluster fit."]
  - ["W2914521323", "Survey of MEMS cross-connects covering insertion loss, crosstalk, switching speed, and scalability for both 2D and 3D MEMS, where 2D MEMS abstracts are nearly empty."]
  - ["W2896156020", "Survey of silicon photonic switch fabrics that defines common metrics across thermo-optic, electro-optic, and MEMS actuation, so one read fills gaps in three routes."]
  - ["W2909208749", "Review of silicon photonic switches with insertion loss, crosstalk, switching time, and packaging per switch engine, the main source for the silicon photonic MEMS cost gap and a cross-check of its wide ranges."]
  - ["W2073240697", "The only core paper on robotic patch panels, so every performance cell for that route depends on its full text."]
  - ["W3034334810", "LCoS core selective switch prototype. Its full text should give crosstalk, polarization dependent loss, and wavelength range, which the LCoS abstracts leave empty."]
  - ["W2913395450", "Design paper for beam steering multicore switches, the best available source for piezo polarization dependent loss, cost, and switching time."]
  - ["W2002555923", "Mordia datacenter switch. Its full text settles whether its wavelength selective switch is LCoS, which decides if the only LCoS switching time belongs to that route."]
  - ["W3215039088", "MEMS mirror core selective switch whose stored abstract lost its polarization dependent loss figure to broken math markup."]
  - ["W2028213396", "SOA gate switch that claims polarization insensitivity and high extinction without the matching crosstalk and polarization figures."]
