    ai_cluster_fit:
      value: "yes"
      confidence: high
      quotes:
        - [W7172527693, "Large-scale photonic switches are emerging as essential devices"]
        - [W1982681165, "offer reconfigurable bandwidth"]
      note: >-
        W7172527693 names AI/ML clusters directly. W4402905306 and W4414694752 also name artificial
        intelligence as a motivation.
    cost_per_port:
      note: >-
        No route abstract gives a cost figure. A human should check the full text of W2896156020, a survey of
        silicon photonic switch fabrics that covers MEMS actuation.
    scaling_limit:
      value: >-
        Electrical interconnect count: individual addressing needs N squared electrodes, and packaging must
        handle N squared electrical and 2N optical connections; optical loss does not accumulate with port
        count in the crossbar
      confidence: medium
      quotes:
        - [W2271940456, "the row/column addressing scales with"]
        - [W2615050161, "The challenges in packaging", "optical interconnections are addressed"]
        - [W2591111335, "switching loss does not accumulate as port count increases"]
      note: >-
        The abstracts write N squared as N2. Row/column addressing (W2271940456) is a way around the
        electrode count.

