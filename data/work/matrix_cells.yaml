    polarization_dependent_loss:
      value: "0.5 to 8.5"
      unit: dB
      value_min: "0.5"
      value_max: "8.5"
      confidence: low
      quotes:
        - [W2591111335, "Polarization-Dependent-Loss (PDL) is held to 0.5 dB"]
        - [W2782897921, "A polarization-dependent loss of 8.5 dB"]
      note: >-
        Not the same kind of figure. 8.5 dB is measured on a fabricated prototype (W2782897921). 0.5 dB is a
        design figure for the Gen-C switch in a dissertation (W2591111335). W2782897921 also gives a
        simulated figure for an improved design.
    crosstalk:
      value: "-30 to -80"
      unit: dB
      value_min: "-80"
      value_max: "-30"
      confidence: medium
      quotes:
