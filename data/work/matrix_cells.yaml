reading_list:
  - [W2073240697, "The only core paper on robotic patch panels, so its full text is the one source for nearly every empty cell of that route."]
  - [W2914521323, "A review of 2D and 3D MEMS cross-connects that discusses loss, crosstalk, switching speed and scalability, which the 2D MEMS abstracts leave empty."]
  - [W2896156020, "A survey of thermo-optic, electro-optic and MEMS silicon photonic switch fabrics that compares common metrics, so one read can cover cost and PDL across three integrated routes."]
  - [W2089755139, "The main 2D MEMS switch paper, covering technology, performance and reliability, for the 2D MEMS cells no other abstract touches."]
  - [W3034334810, "The LCoS core selective switch prototype, the route's only device paper that names LCoS, for its optical specifications."]
  - [W2591729902, "The built multi-core fiber beam-steering switch, for the piezo optical specifications and to confirm whether its actuators are piezoelectric."]
  - [W2028213396, "The SOA gate switch paper, for crosstalk and polarization figures behind its extinction ratio and polarization insensitivity claims."]
  - [W2056973550, "An invited SOA switch fabric study for computing, for the wavelength range and any cost figure of SOA fabrics."]
  - [W2002555923, "Mordia, the route's microsecond switching figure, to confirm whether its wavelength-selective switch is LCoS and to find what limits scale."]
  - [W3215039088, "The MEMS mirror core selective switch whose abstract prints its PDL figure as a garbled LaTeX fragment, so only the full text can give the 3D MEMS PDL value."]
