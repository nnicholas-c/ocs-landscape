      confidence: medium
      quotes:
        - [W1653883346, "fully nonblocking"]
      note: >-
        Single-chip switch. W2605844474 reports a MEMS phase modulator array for diffraction-based
        switching, and its array size is not a port count.
    polarization_dependent_loss:
      note: >-
        No route abstract mentions polarization. A human should check the full text of W2089755139, which
        discusses the performance of 2D MEMS optical switches.
    crosstalk:
      note: >-
        No route abstract gives a crosstalk figure. A human should check the full text of W2914521323, a
        review that lists crosstalk among the optical properties it discusses.
    wavelength_range:
      note: >-
        No route abstract gives a wavelength or band. A human should check the full text of W2089755139.
    integration:
      value: free_space_bulk
      confidence: low
      quotes:
        - [W2605844474, "starting from the reflective two-dimensional"]
      note: >-
        The abstract names reflective 2D MEMS switches, meaning micromirrors that reflect beams, which is
        the free_space_bulk definition. No route abstract says free space in words, hence low confidence.
    packaging_notes:
      value: >-
        Packaged component; high reliability of the actuation mechanism; packaging method not stated
      confidence: low
      quotes:
        - [W1653883346, "high reliability of the actuation mechanism", "packaged component"]
      note: The abstract says the component was packaged but not how.
    trl_band:
      value: lab
      confidence: medium
      quotes:
        - [W1653883346, "fully nonblocking"]
      note: No route abstract or projects.csv row reports a field trial or product for this route.
    ai_cluster_fit:
      value: "no"
      confidence: medium
      quotes:
        - [W2089755139, "could revolutionize fiber optic telecommunications"]
      note: >-
        Route abstracts name telecommunications and fiber optic networks as uses, and none names data
        centers, accelerators or machine learning.
    cost_per_port:
      note: >-
        W2089755139 calls silicon optical MEMS low-cost without a figure. A human should check the full
        text of W2089755139.
    scaling_limit:
      note: >-
        No route abstract states what limits the port count of 2D MEMS switches. W2605844474 says mirror
        size limits speed, not port count. A human should check the full text of W2914521323.

  mems_silicon_photonic:
    switching_time:
      value: "0.4 to 200"
