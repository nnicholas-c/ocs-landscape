# Stage 6 cell decisions, run 2. Read by pipeline/matrix_build.py.
# Written by the analyst from data/work/route_<route>.json (pipeline.matrix_export) and data/projects.csv.
# quotes: [source, anchor] copies the sentence holding the anchor; [source, start, end] copies start through end.
# source is a paper_id in that route's file, or "row N" for the Nth data row of data/projects.csv.
# A cell with no value is not_reported_in_abstract; its note names the paper whose full text should answer it.
# academic_groups and companies are computed by the builder and do not appear here.

cells:
  piezo:
    switching_time:
      value: millisecond scale
      unit: ""
      confidence: low
      note: "Stated only as an order of magnitude for piezoelectric (PZT) beam steering inside a simulated data center network design, a secondary route match. No piezo device abstract gives a switching time."
      quotes:
        - ['W4323644257', 'a re-configurable network with both tunable sources', 'millisecond PZT switching time']
    insertion_loss:
      value: below 2.2
      unit: dB
      confidence: medium
      note: "Core-to-core loss of a small multicore-fiber beam-steering switch, the only piezo loss figure in the abstracts."
      quotes:
        - ['W2591729902', 'A 3-port single-sided']
    port_count:
      value: 3 to 50
      unit: ports
      value_min: 3
      value_max: 50
      confidence: low
      note: "The low end is a built prototype (W2591729902). The high end is a design estimate for multicore fibers, not a built switch (W2913395450)."
      quotes:
        - ['W2591729902', 'A 3-port single-sided']
        - ['W2913395450', 'A 50 port switch is possible', 'after 1 km']
    polarization_dependent_loss:
      note: "No piezo abstract gives a PDL figure. A human should check the full text of W2913395450 and W2591729902."
    crosstalk:
      value: "-25"
      unit: dB
      confidence: low
      note: "Design estimate of intercore crosstalk in a multicore-fiber beam-steering switch, not a measured port-to-port crosstalk."
      quotes:
        - ['W2913395450', 'A 50 port switch is possible', 'after 1 km']
    wavelength_range:
      value: "1550"
      unit: nm
      confidence: low
      note: "An operating wavelength assumed for a design analysis, not a measured band."
      quotes:
        - ['W2913395450', 'assuming an operational wavelength', '1550 nm']
    integration:
      value: free_space_bulk
      confidence: medium
      note: "The vendor description in projects.csv row 5 (Polatis) aligns collimated beams between opposing fiber arrays, and W2913395450 steers beams with collimator actuators. No piezo abstract says free space in words."
      quotes:
        - ['row 5']
        - ['W2913395450', 'assuming an operational wavelength', 'collimator actuator angle']
    packaging_notes:
      value: Multicore fibers integrated directly at the switch ports; losses from misalignment and core-pitch variation estimated
      confidence: medium
      quotes:
        - ['W2591729902', 'We report on the development of the first multi-lane']
        - ['W2913395450', 'Potential losses from system misalignments']
    trl_band:
      value: lab
      confidence: medium
      note: "Both piezo device papers are lab builds or designs. projects.csv row 5 (Polatis) has stage shipping, but its evidence quote describes the mechanism and not availability, and row 10 (Drut) has stage unknown, so neither quote supports pilot or production. A human should check the Polatis product page."
      quotes:
        - ['W2591729902', 'We report on the development of the first multi-lane']
    ai_cluster_fit:
      value: "yes"
      confidence: medium
      note: "Both supporting papers are data center network designs that use piezo beam steering to reconfigure links (secondary route matches). Neither names accelerators, GPUs, TPUs, or ML training."
      quotes:
