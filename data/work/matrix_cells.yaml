# Stage 6 analyst cell decisions, rebuilt from scratch in the rework after run 1.
# Read by pipeline.matrix_build (cells) and pipeline.matrix_render (reading_list).
#
# Each cell lists quotes as [source, start] or [source, start, end]. source is a
# paper_id from data/work/route_<route>.json or "row N" (Nth data row of
# data/projects.csv). With one anchor the builder copies the whole sentence that
# contains it from the abstract; with two it copies from start through end. With
# no anchor it copies the project row's full evidence_quote. Quotes are never typed here.
# A cell with no value is not_reported_in_abstract. academic_groups and companies
# are computed by the builder and do not appear here.

cells:
  mems_3d:
    switching_time:
      value: '20 us to a few ms'
      quotes:
        - [W2560361359, 'to achieve 150', 'switching time.']
        - [W2996949883, 'However, 3D MEMS fabrics are generally dismissed']
        - [W2914521323, 'The switching MEMS-based cross-connects speed']
      confidence: medium
      note: 'Both microsecond figures come from W2560361359, which gives up any-to-any connection. 150 us is measured on a 61-port prototype and 20 us is a design for a 2048-port selector switch. W2996949883 says conventional 3D MEMS switches take a few milliseconds. The review W2914521323 spans less than 1 us to tens of ms across all MEMS crossconnect types.'
    insertion_loss:
      value: '1.2 to 4.0'
      unit: dB
      value_min: 1.2
      value_max: 4.0
      quotes:
        - [W3215039088, 'We experimentally show that the CSS prototype']
        - [W2138361600, 'We present a microelectromechanical systems-based']
        - [W2040047675, 'This paper describes the subsystem design']
        - [W1982772673, 'The low loss (<3dB']
      confidence: medium
      note: 'The top of the range is the maximum loss of a crossconnect with more than 1100 ports (W2138361600). The bottom is a small core selective switch for multicore fiber (W3215039088), a different device class. Average losses of large crossconnects fall inside the range (W2040047675, W1982772673).'
    port_count:
      value: 'more than 1100'
      unit: ports
      quotes:
        - [W2138361600, 'We present a microelectromechanical systems-based']
      confidence: medium
      note: 'Largest port count demonstrated in a route abstract. W2560361359 gives a larger count for a design only. W3041044413 has a title and an abstract that disagree on the module size, so a human should check the full text of W3041044413.'
    polarization_dependent_loss:
      quotes:
        - [W3215039088, 'We experimentally show that the CSS prototype']
      note: 'W3215039088 prints its polarization dependent loss with garbled markup as a negative figure, which cannot be a loss as written, so no value is entered. A human should check the full text of W3215039088.'
    crosstalk:
      note: 'W2040047675 compares expected and measured static and dynamic crosstalk without a figure in the abstract, and W2529948110 only says low crosstalk. A human should check the full text of W2040047675 and of the production system paper W4292950821.'
    wavelength_range:
      value: '1500 to 1630'
      unit: nm
      value_min: 1500
      value_max: 1630
      quotes:
        - [W3215039088, 'We experimentally show that the CSS prototype']
      confidence: medium
      note: 'Only W3215039088, a core selective switch for multicore fiber, states a range. The same abstract reports transmission in the C, S and L bands.'
    integration:
      value: free_space_bulk
      quotes:
        - [W2138361600, 'We present a microelectromechanical systems-based']
      confidence: high
      note: 'Beam steering between micromirror arrays sends light through free space between fiber ports.'
    packaging_notes:
      value: 'cubic switch housing, packaging by tolerance expansion, shock absorption; microlens-based multicore fiber collimator array'
      quotes:
        - [W2043855221, 'stable switch housing with cubic structure', 'reliability by shock absorption']
        - [W3215039088, 'In this paper, we report on a novel CSS design']
      confidence: medium
    trl_band:
      value: production
      quotes:
        - [W4292950821, 'In this paper, we describe Apollo']
        - [row 1]
        - [row 4]
      confidence: high
      note: 'Apollo is a production deployment of an internally developed 3D MEMS switch (W4292950821), and projects.csv row 1 is the Google blog on the same system. projects.csv row 4 (Calient) reports shipped switches, a vendor claim.'
    ai_cluster_fit:
      value: 'yes'
      quotes:
        - [W2560361359, 'This architecture and switch design enable']
        - [W4292950821, 'In this paper, we describe Apollo']
      confidence: medium
      note: 'Yes under the comparison-framework definition, because W2560361359 proposes a switch that moves a data center network between preset interconnection topologies and W4292950821 reports production use in datacenter networks. No abstract in this route names accelerators, GPUs, TPUs or machine learning training.'
    cost_per_port:
      value: '100'
      unit: USD per port
      quotes:
        - [W2996949883, 'However, 3D MEMS fabrics are generally dismissed']
      confidence: medium
      note: 'Stated as the high cost that keeps 3D MEMS out of data centers. The same abstract claims its open loop control lowers that cost.'
    scaling_limit:
      value: 'switching speed falls as port count grows, set by micromirror dynamics'
      quotes:
        - [W2560361359, 'However, conventional MEMS beam-steering cross-connects']
        - [W2108251206, 'We present a first-principles analysis']
        - [W2529948110, 'As indicated by the simulation results']
      confidence: high

