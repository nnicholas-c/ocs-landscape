        - [W4226451033, "the cross-talk is -80 dB"]
      note: The -30 dB end is a wavelength cross-connect (W2979824403), the -80 dB end a wafer-bonded switch (W4226451033).
    wavelength_range:
      value: "1250 to 1700 nm; C band"
      unit: nm
      value_min: "1250"
      value_max: "1700"
      confidence: medium
      quotes:
        - [W3115038226, "ultra-broad wavelength range of"]
        - [W2257494936, "a broad spectral bandwidth"]
        - [W7172527693, "operating in C-band"]
      note: >-
        The low end is a single total internal reflection switch (W3115038226), the high end a crossbar
        switch (W2257494936). W7172527693 names only the C band.
    integration:
      value: integrated_photonic
      confidence: high
      quotes:
        - [W1982681165, "we report on a new type of integrated OCS"]
      note: Silicon photonic waveguides moved by MEMS actuators on one chip.
    packaging_notes:
      value: >-
        Electrical redistribution lines on an aluminum nitride interposer and a polished lidless fiber
        array; through glass via interposer with a pitch reducing fibre array; pluggable package with
        passive optical coupling; runs reliably over 10 billion cycles in ambient environment without packaging
      confidence: medium
      quotes:
        - [W2615050161, "single-layer electrical redistribution lines", "lidless fiber array (FA)"]
        - [W2786734285, "We design and fabricate the packaging"]
        - [W2919451605, "we proposed a pluggable silicon photonic MEMS switch package"]
        - [W1945545782, "The switch operates reliably over"]
      note: Items from four papers, each stated once.
    trl_band:
      value: lab
      confidence: medium
      quotes:
        - [W2782897921, "An experimental prototype switch was fabricated"]
      note: >-
        projects.csv row 8 (nEye) has stage prototype, and its quote says the chip moves from the lab to the
        fab, which does not show a pilot run or a product. W3138799074 reports fabrication in a commercial
