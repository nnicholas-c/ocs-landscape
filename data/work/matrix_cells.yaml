      note: >-
        The low end is a single switch element (W7172527693). The high end is the maximum on-chip loss of
        the largest fabric (W2800201100). Packaged fiber-to-fiber loss is reported separately in W2581695752.
    port_count:
      value: "128 x 128"
      confidence: high
      quotes:
