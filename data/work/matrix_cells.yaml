# Stage 6 cell decisions, step 2 (run 2 after the anchor papers), rebuilt from scratch.
# Decided from data/work/route_<route>.json (pipeline.matrix_export) and data/projects.csv only.
# pipeline.matrix_build copies every quote programmatically from the anchors below:
#   [source]                 whole abstract or whole projects.csv evidence_quote
#   [source, anchor]         the sentence that contains anchor
#   [source, start, end]     the verbatim span from start through end
# source is a paper_id from the route file or "row N" (Nth data row of data/projects.csv).
# academic_groups and companies are computed by the builder and are not listed here.
# Category cells (integration, trl_band, ai_cluster_fit) carry only the controlled label.

cells:
  mems_3d:
    switching_time:
      value: "150 us to a few ms"
      confidence: medium
      quotes:
        - [W2560361359, "proof-of-principle prototype using a single comb-driven MEMS mirror"]
        - [W2996949883, "slow switching speeds"]
      note: >-
        Two papers, two different figures, kept as a range. The low end is a proof-of-principle selector
        switch that relaxes arbitrary configurability (W2560361359). The high end is the speed W2996949883
        gives for 3D MEMS fabrics in general. The Apollo paper (W4292950821) names switching time as a
        design requirement without a figure, so a human should check its full text.
    insertion_loss:
      value: "1.2 to 4.0"
      unit: dB
      value_min: "1.2"
      value_max: "4.0"
      confidence: high
      quotes:
        - [W3215039088, "We experimentally show that the CSS prototype", "2.7 dB)"]
        - [W2040047675, "1.33-dB average loss"]
        - [W1982772673, "The low loss"]
        - [W2138361600, "maximum insertion loss of 4.0 dB"]
      note: >-
        Range across four route papers that agree loss stays within a few dB. The low end is a MEMS mirror
        core selective switch prototype (W3215039088). The high end is the maximum loss over all connections
        of the largest crossconnect (W2138361600), whose mean is 2.1 dB.
    port_count:
      value: "more than 1100"
      unit: ports
      confidence: medium
      quotes:
        - [W2138361600, "port count exceeding 1100"]
      note: >-
        Largest demonstrated. Other route papers report smaller fabrics (W2040047675, W1982772673). The
        larger selector switch in W2560361359 is an optical design, not a build. The W3041044413 abstract
        gives port numbers that disagree with its own title, so it is not used.
    polarization_dependent_loss:
      note: >-
        The only PDL figure in the route abstracts (W3215039088) is a garbled LaTeX fragment that cannot be
        read as a PDL value. A human should check the full text of W3215039088.
    crosstalk:
      note: >-
        W2040047675 says expected and measured static and dynamic crosstalk are compared, the review
        W2914521323 lists crosstalk among the optical properties it discusses, and W7171539399 characterizes
        crosstalk at the quantum level, but no abstract gives a figure. A human should check the full text
        of W2914521323 or W2040047675.
    wavelength_range:
      value: "1500 to 1630 nm (S band, C band, L band)"
      unit: nm
      value_min: "1500"
      value_max: "1630"
      confidence: medium
      quotes:
        - [W3215039088, "an ultra-wide wavelength range from 1500 nm", "S-band, and L-band"]
      note: >-
        One paper, a MEMS mirror core selective switch prototype. The quote runs from the end of one
        sentence into the next so that the range and the band names come from the same source.
    integration:
      value: free_space_bulk
      confidence: medium
      quotes:
        - [W3215039088, "collimator array and a micro-electromechanical systems (MEMS) mirror array"]
      note: >-
        A fiber collimator array facing a MEMS mirror array means beams cross free space, which is the
        free_space_bulk definition in the ocs-domain skill.
    packaging_notes:
      value: >-
        Stable cubic switch housing, packaging by tolerance expansion, simple component assembly, shock
        absorption for reliability; precise alignment between multicore fibers and collimator lenses
      confidence: medium
      quotes:
        - [W2043855221, "stable switch housing with cubic structure", "reliability by shock absorption"]
        - [W3215039088, "The former enables precise alignment"]
      note: >-
        Items from two papers, each stated once. In W3215039088 "the former" is the collimator array named
        in the sentence before.
    trl_band:
      value: production
      confidence: high
      quotes:
        - [W4292950821, "first large-scale production deployment"]
        - ["row 1"]
        - ["row 4"]
      note: >-
        W4292950821 calls Apollo a large-scale production deployment, and a later sentence of the same
        abstract says its OCS is an internally developed 3D MEMS-based design. projects.csv row 1 is the same
        Google system. projects.csv row 4 (Calient) is an independent vendor claim, and its tech_route comes from the
        scout's seed list, not from the page (see its note in data/projects.csv).
    ai_cluster_fit:
      value: "yes"
      confidence: high
      quotes:
        - [W2560361359, "can realize a number of useful interconnection topologies"]
        - [W2792477041, "Results show that it is feasible to use MEMS retroreflective"]
        - ["row 11"]
      note: >-
        W2560361359 proposes the route for data center networks with switchable interconnection topologies,
        and W2792477041 uses MEMS beam steering for reconfigurable links between datacenter racks. No route
        abstract names accelerators or machine learning. The AI data center use comes only from
        projects.csv row 11, a vendor claim about concept prototypes. Apollo (W4292950821) describes
        datacenter use without naming accelerators or a spine layer.
    cost_per_port:
      value: "100"
      unit: USD per port
      confidence: low
      quotes:
        - [W2996949883, "slow switching speeds"]
      note: >-
        Stated in passing by W2996949883 as the high cost that keeps 3D MEMS fabrics out of data centers,
        not a measured price. The paper claims its control method cuts cost by a factor of three.
    scaling_limit:
      value: >-
        Response speed trades against port count, crosstalk and insertion loss; conventional MEMS
        beam-steering cross-connects cannot give submillisecond switching at the port count data centers need
      confidence: high
      quotes:
        - [W2560361359, "cannot provide submillisecond switching"]
        - [W2108251206]
      note: Two papers state the same trade-off between switching speed and port count.

  mems_2d:
    switching_time:
      note: >-
        No route abstract gives a switching time for 2D MEMS. The review W2914521323 gives a range for MEMS
        cross-connects in general without saying which part applies to 2D mirrors, so a human should check
        its full text.
    insertion_loss:
      note: >-
        W1653883346 says low loss without a figure. A human should check the full text of W2914521323 or
        W1653883346.
    port_count:
